name: Build Android APK

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "main", "fix/ci-webrtc-gradle" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34 SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build Debug APKs
        run: gradle assembleControlDebug assembleClientDebug --no-daemon --stacktrace

      - name: Generate release keystore (for signed APKs)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CamGuard, OU=Dev, O=CamGuard, L=Dubai, C=AE"
          fi

      - name: Build signed Release APKs
        run: gradle assembleControlRelease assembleClientRelease --no-daemon --stacktrace

      - name: Upload Control (dashboard) debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CamGuard-Control-debug-apk
          path: app/build/outputs/apk/control/debug/*.apk
          if-no-files-found: error

      - name: Upload Camera (client) debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CamGuard-Camera-debug-apk
          path: app/build/outputs/apk/client/debug/*.apk
          if-no-files-found: error

      - name: Upload Control (dashboard) signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: CamGuard-Control-release-apk
          path: app/build/outputs/apk/control/release/*.apk
          if-no-files-found: warn

      - name: Upload Camera (client) signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: CamGuard-Camera-release-apk
          path: app/build/outputs/apk/client/release/*.apk
          if-no-files-found: warn
