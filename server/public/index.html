<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Remote Camera Monitor</title>
</head>
<body>
    <h2>Live Camera Stream</h2>
    <img id="stream" src="" alt="Waiting for camera stream..." width="640">

    <script>
        // Connect to Node.js WebSocket server to receive video frames
        const ws = new WebSocket('ws://' + window.location.host);
        const img = document.getElementById('stream');

        ws.onmessage = (event) => {
            // Update image source with received base64 or blob frame
            img.src = 'data:image/jpeg;base64,' + event.data;
        };
    </script>
</body>
</html>
